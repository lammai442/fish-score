# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${file(./config.yml):aws.org, 'default-org'}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: fishScore

plugins:
  - serverless-wsgi
  - serverless-python-requirements

# Connection to Flask
custom:
  wsgi:
    # The name of the app
    app: app.app

provider:
  name: aws
  runtime: python3.12
  iam:
    role: ${file(./config.yml):aws.role}
  environment:
    USERS_TABLE: fishScore

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: fishScore
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

